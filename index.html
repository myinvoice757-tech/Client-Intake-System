<script>
    // Paste your active Google Apps Script Web App URL below:
    const APPS_SCRIPT_WEBAPP_URL = "https://script.google.com/macros/s/AKfycbwUMo7Z8eAVGP24Amss7QqbwKHi359WBn2Zv07rbmp3kh2nANtKsjqVo7YYJlQKv2F8HQ/exec";

    // 1. Digital Clock
    function updateClock() {
      const now = new Date();
      const clockEl = document.getElementById('liveClock');
      if (clockEl) {
        clockEl.textContent = now.toLocaleTimeString('en-US', { hour12: true });
      }
    }
    setInterval(updateClock, 1000);
    updateClock();

    // 2. Secret Logo Trigger for Command Hub (Click 3 Times)
    let logoClickCount = 0;
    let logoClickTimer = null;
    const logoTrigger = document.getElementById('secretLogoTrigger');
    if (logoTrigger) {
      logoTrigger.addEventListener('click', () => {
        logoClickCount++;
        clearTimeout(logoClickTimer);
        if (logoClickCount === 3) {
          logoClickCount = 0;
          promptAdminModal();
        } else {
          logoClickTimer = setTimeout(() => { logoClickCount = 0; }, 800);
        }
      });
    }

    // Keyboard shortcut: Ctrl + Shift + D (or Cmd + Shift + D)
    window.addEventListener('keydown', (e) => {
      if ((e.ctrlKey || e.metaKey) && e.shiftKey && (e.key === 'D' || e.key === 'd')) {
        e.preventDefault();
        promptAdminModal();
      }
    });

    // 3. Service Package Tier Switching
    function updateTierDisplay(tierId) {
      const tiers = ['essential', 'standard', 'professional', 'ultra'];
      tiers.forEach(t => {
        const el = document.getElementById('tier-card-' + t);
        if (el) {
          if (t === tierId) {
            el.classList.add('active');
          } else {
            el.classList.remove('active');
          }
        }
      });
    }

    // 4. File Attachment Handler
    let uploadedFileData = null;
    function handleFileSelection(e) {
      const file = e.target.files[0];
      if (!file) return;
      const reader = new FileReader();
      reader.onload = evt => {
        uploadedFileData = { 
          name: file.name, 
          type: file.type, 
          base64: evt.target.result.split(',')[1] 
        };
        const label = document.getElementById('uploadLabel');
        if (label) {
          label.textContent = `Attached: ${file.name.substring(0, 16)}...`;
        }
      };
      reader.readAsDataURL(file);
    }

    // 5. Reset Form to Studio Defaults
    function resetFormToDefaults() {
      const form = document.getElementById('intakeForm');
      if (form) form.reset();

      const defaultRadio = document.querySelector('input[value="Pro Tier"]');
      if (defaultRadio) defaultRadio.checked = true;
      updateTierDisplay('professional');

      ['vibeMinimal', 'vibeModern', 'vibePlayful', 'vibeLoud', 'vibeLuxury'].forEach(id => {
        const slider = document.getElementById(id);
        if (slider) slider.value = 3;
      });

      const defaults = {
        baseColor: '#070a12', baseColorText: '#070a12',
        primaryColor: '#D36B3F', primaryColorText: '#D36B3F',
        secondaryColor: '#8C3E1F', secondaryColorText: '#8C3E1F',
        accentColor: '#E8855A', accentColorText: '#E8855A',
        neutralColor: '#1e293b', neutralColorText: '#1e293b',
        lightColor: '#f8fafc', lightColorText: '#f8fafc'
      };
      for (const [key, val] of Object.entries(defaults)) {
        const el = document.getElementById(key);
        if (el) el.value = val;
      }

      uploadedFileData = null;
      const label = document.getElementById('uploadLabel');
      if (label) {
        label.textContent = 'Drag & Drop Files or Browse';
      }
    }

    // 6. Submit Design Brief to Google Apps Script
    async function handleFormSubmission(e) {
      e.preventDefault();
      const btn = document.getElementById('submitBtn');
      if (btn) {
        btn.disabled = true; 
        btn.innerHTML = `<span class="inline-block animate-spin mr-2">↻</span> Submitting...`;
      }

      const selectedPackage = document.querySelector('input[name="packageTier"]:checked');
      const packageValue = selectedPackage ? selectedPackage.value : 'Custom Quote';
      const categoryEl = document.getElementById('projectCategory');
      const baseCategory = categoryEl ? categoryEl.value : 'General';

      const payload = {
        name: document.getElementById('clientName')?.value || '',
        company: document.getElementById('companyName')?.value || '',
        email: document.getElementById('clientEmail')?.value || '',
        category: `${baseCategory} (${packageValue})`,
        timeline: document.getElementById('projectTimeline')?.value || '',
        vibes: { 
          minimal: document.getElementById('vibeMinimal')?.value || '3', 
          modern: document.getElementById('vibeModern')?.value || '3', 
          playful: document.getElementById('vibePlayful')?.value || '3', 
          loud: document.getElementById('vibeLoud')?.value || '3', 
          luxury: document.getElementById('vibeLuxury')?.value || '3' 
        },
        palette: { 
          base: document.getElementById('baseColorText')?.value || '#070a12', 
          primary: document.getElementById('primaryColorText')?.value || '#D36B3F',
          secondary: document.getElementById('secondaryColorText')?.value || '#8C3E1F',
          accent: document.getElementById('accentColorText')?.value || '#E8855A',
          neutral: document.getElementById('neutralColorText')?.value || '#1e293b',
          light: document.getElementById('lightColorText')?.value || '#f8fafc'
        },
        description: document.getElementById('projectDesc')?.value || '',
        directMessage: document.getElementById('clientDirectMessage')?.value || '',
        nda: document.getElementById('ndaCheckbox')?.checked ? 'Yes' : 'No',
        file: uploadedFileData
      };

      try {
        await fetch(APPS_SCRIPT_WEBAPP_URL, {
          method: 'POST',
          mode: 'no-cors',
          headers: { 'Content-Type': 'text/plain;charset=utf-8' },
          body: JSON.stringify(payload)
        });
        formSuccessCleanup(btn);
      } catch (err) {
        alert("Submission failed. Please check network connection.");
        if (btn) {
          btn.disabled = false; 
          btn.textContent = 'Submit Design Brief';
        }
      }
    }

    function formSuccessCleanup(btn) {
      const modal = document.getElementById('successModal');
      if (modal) modal.classList.remove('hidden');
      resetFormToDefaults();
      if (btn) {
        btn.disabled = false; 
        btn.textContent = 'Submit Design Brief';
      }
    }

    function closeSuccessModal() { 
      const modal = document.getElementById('successModal');
      if (modal) modal.classList.add('hidden'); 
    }

    // 7. 3D AI Concierge Aria Logic
    let lastAriaSpeech = "Hi! I am Aria, your Cetora design concierge. How can I help you tailor your job order today?";

    function toggleAiAssistant() {
      const win = document.getElementById('aiAssistantWindow');
      if (win) {
        win.classList.toggle('hidden');
        if (!win.classList.contains('hidden')) {
          setTimeout(() => document.getElementById('aiChatInput')?.focus(), 100);
        }
      }
    }

    function appendMessage(sender, text) {
      const log = document.getElementById('aiChatLog');
      if (!log) return;
      const isAria = sender === 'aria';
      const msgDiv = document.createElement('div');
      msgDiv.className = `flex gap-2.5 items-start ${isAria ? '' : 'flex-row-reverse'}`;

      const avatar = document.createElement('div');
      avatar.className = `w-6 h-6 rounded-full text-[10px] font-bold flex items-center justify-center shrink-0 border ${
        isAria ? 'bg-[#D36B3F]/30 text-[#E8855A] border-[#D36B3F]/50' : 'bg-slate-700 text-white border-white/20'
      }`;
      avatar.textContent = isAria ? 'A' : 'You';

      const bubble = document.createElement('div');
      bubble.className = `p-3 rounded-2xl text-xs leading-relaxed max-w-[85%] ${
        isAria ? 'gel-surface rounded-tl-sm text-slate-200 border-white/10' : 'bg-[#D36B3F] text-slate-950 font-medium rounded-tr-sm'
      }`;
      bubble.innerHTML = text;

      msgDiv.appendChild(avatar);
      msgDiv.appendChild(bubble);
      log.appendChild(msgDiv);
      log.scrollTop = log.scrollHeight;

      if (isAria) {
        lastAriaSpeech = text.replace(/<[^>]*>?/gm, ''); 
      }
    }

    function askAiPrompt(query) {
      const input = document.getElementById('aiChatInput');
      if (input) {
        input.value = query;
        handleAiChatSubmit(new Event('submit'));
      }
    }

    function handleAiChatSubmit(e) {
      e.preventDefault();
      const input = document.getElementById('aiChatInput');
      if (!input) return;
      const query = input.value.trim();
      if (!query) return;

      appendMessage('user', query);
      input.value = '';

      setTimeout(() => {
        const q = query.toLowerCase();
        let reply = "";
        if (q.includes('turnaround') || q.includes('time') || q.includes('fast') || q.includes('speed')) {
          reply = "Our studio delivers fast iterations! Logo & Poster concepts can complete within <strong>1 to 3 days</strong>, while full 3D and Web projects typically run <strong>1 to 2 weeks</strong>.";
        } else if (q.includes('nda') || q.includes('privacy')) {
          reply = "Absolute privacy is guaranteed. Check the <strong>'Require mutual Non-Disclosure Agreement'</strong> box at the bottom of the form.";
        } else if (q.includes('quote') || q.includes('price') || q.includes('cost')) {
          reply = "You can click on the tabs at the top of the form (Essential, Standard, Professional, Ultra) to view package pricing! Or click the WhatsApp button for custom quotes.";
        } else {
          reply = `Got it! For questions regarding "<em>${query}</em>", feel free to add a note directly in the <strong>💬 Direct Message</strong> box or click through to our WhatsApp!`;
        }
        appendMessage('aria', reply);
      }, 450);
    }

    function speakLastResponse() {
      if ('speechSynthesis' in window) {
        window.speechSynthesis.cancel();
        const utter = new SpeechSynthesisUtterance(lastAriaSpeech);
        utter.pitch = 1.1;
        utter.rate = 1.0;
        window.speechSynthesis.speak(utter);
      }
    }

    // 8. Command Hub PIN Authentication & JSONP Live Stream
    function promptAdminModal() { 
      const modal = document.getElementById('pinModal');
      if (modal) {
        modal.classList.remove('hidden'); 
        setTimeout(() => document.getElementById('adminPin')?.focus(), 50); 
      }
    }
    
    function closePinModal() { 
      const modal = document.getElementById('pinModal');
      if (modal) modal.classList.add('hidden'); 
      const pinInput = document.getElementById('adminPin');
      if (pinInput) pinInput.value = ''; 
    }

    const VALID_ADMIN_PINS = ['1234', '5678', '9900'];
    function verifyAndOpenHub() {
      const pinInput = document.getElementById('adminPin');
      const pin = pinInput ? pinInput.value.trim() : '';
      if (VALID_ADMIN_PINS.includes(pin)) {
        closePinModal();
        document.getElementById('clientIntakeView')?.classList.add('hidden');
        document.getElementById('designerHubView')?.classList.remove('hidden');
        document.getElementById('hubExitBtn')?.classList.remove('hidden');
        refreshHubData();
      } else { 
        alert('Invalid PIN Access Denied.'); 
        if (pinInput) pinInput.value = '';
      }
    }

    function exitDesignerHub() {
      document.getElementById('designerHubView')?.classList.add('hidden');
      document.getElementById('clientIntakeView')?.classList.remove('hidden');
      document.getElementById('hubExitBtn')?.classList.add('hidden');
    }

    // Streams live brief rows via JSONP
    function refreshHubData() {
      const tbody = document.getElementById('briefsTableBody');
      if (tbody) {
        tbody.innerHTML = '<tr><td colspan="5" class="p-8 text-center text-[#E8855A] font-mono">Loading real-time submissions...</td></tr>';
      }
      
      const existingScript = document.getElementById('hubJsonpScript');
      if (existingScript) existingScript.remove();

      window.handleHubDataResponse = function(rows) {
        renderHubTable(rows);
        const s = document.getElementById('hubJsonpScript');
        if (s) s.remove();
      };

      const script = document.createElement('script');
      script.id = 'hubJsonpScript';
      script.src = `${APPS_SCRIPT_WEBAPP_URL}?callback=handleHubDataResponse&t=${Date.now()}`;
      script.onerror = function() {
        if (tbody) {
          tbody.innerHTML = '<tr><td colspan="5" class="p-8 text-center text-slate-400">Unable to load data. Click "Open Sheet ↗" above to view directly in Google Sheets.</td></tr>';
        }
      };
      document.body.appendChild(script);
    }

    function renderHubTable(rows) {
      const tbody = document.getElementById('briefsTableBody');
      if (!tbody) return;
      if (!rows || rows.length === 0) {
        tbody.innerHTML = '<tr><td colspan="5" class="p-8 text-center text-slate-400">No submissions found.</td></tr>';
        return;
      }
      let html = '';
      rows.forEach(r => {
        const fileBtn = r.driveLink ? `<a href="${r.driveLink}" target="_blank" class="text-[#E8855A] hover:underline font-mono">View File ↗</a>` : '<span class="text-slate-600">None</span>';
        html += `<tr class="hover:bg-white/[0.02]">
          <td class="p-3.5 font-mono text-slate-400 text-[11px]">${r.timestamp || ''}</td>
          <td class="p-3.5"><p class="font-bold text-white text-xs">${r.clientName || 'Anonymous'}</p><p class="text-[11px] text-slate-400">${r.company || ''} • ${r.email || ''}</p></td>
          <td class="p-3.5"><span class="px-2 py-0.5 rounded-full text-[10px] font-bold bg-[#D36B3F]/10 text-[#E8855A] border border-[#D36B3F]/20">${r.category || ''}</span></td>
          <td class="p-3.5 text-amber-200 font-medium bg-amber-950/20 rounded-lg">"${r.directMessage || 'None'}"</td>
          <td class="p-3.5 text-right">${fileBtn}</td>
        </tr>`;
      });
      tbody.innerHTML = html;
    }
  </script>
