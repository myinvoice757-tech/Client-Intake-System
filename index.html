<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>CETORA DESIGN | The Studio One — Client Brief Intake</title>
  
  <!-- Tailwind CSS -->
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- Font Awesome Icons -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

  <style>
    @import url('https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&family=JetBrains+Mono:wght@400;500;600;700&display=swap');

    body {
      font-family: 'Plus Jakarta Sans', sans-serif;
      background: radial-gradient(circle at 50% 0%, #1c0e08 0%, #080c16 45%, #040508 100%);
      background-attachment: fixed;
      color: #f8fafc;
      min-height: 100vh;
    }

    .font-mono {
      font-family: 'JetBrains Mono', monospace;
    }

    /* Sleek Studio Window Frame with Ambient Glow */
    .studio-window {
      background: linear-gradient(180deg, rgba(14, 19, 32, 0.92) 0%, rgba(8, 11, 18, 0.96) 100%);
      border: 1px solid rgba(255, 255, 255, 0.08);
      box-shadow: 0 35px 90px rgba(0, 0, 0, 0.85), 0 0 50px rgba(211, 107, 63, 0.08);
      backdrop-filter: blur(24px);
      -webkit-backdrop-filter: blur(24px);
    }

    /* 3D Elevated Logo Card */
    .logo-badge-3d {
      background: linear-gradient(145deg, #182033 0%, #080b12 100%);
      border: 1.5px solid rgba(211, 107, 63, 0.6);
      box-shadow: 0 8px 24px rgba(0, 0, 0, 0.8), 
                  0 0 20px rgba(211, 107, 63, 0.4), 
                  inset 0 1px 2px rgba(255, 255, 255, 0.25);
      transform: perspective(600px) translateZ(0);
      transition: all 0.3s cubic-bezier(0.2, 0.8, 0.2, 1);
    }
    .logo-badge-3d:hover {
      transform: perspective(600px) translateY(-2px) scale(1.04);
      box-shadow: 0 12px 30px rgba(0, 0, 0, 0.9), 
                  0 0 30px rgba(211, 107, 63, 0.65), 
                  inset 0 1px 3px rgba(255, 255, 255, 0.4);
      border-color: #E8855A;
    }

    /* Input Field Styling */
    .studio-input {
      background: #0f1524;
      border: 1px solid #1c263c;
      color: #f8fafc;
      border-radius: 10px;
      font-size: 13px;
      padding: 10px 14px;
      transition: all 0.2s ease;
      width: 100%;
    }
    .studio-input:focus {
      outline: none;
      border-color: #D36B3F;
      box-shadow: 0 0 0 2px rgba(211, 107, 63, 0.25);
    }
    .studio-input::placeholder {
      color: #475569;
    }

    /* Dual-Spectrum Range Slider */
    input[type=range] {
      -webkit-appearance: none;
      background: #1c2436;
      height: 4px;
      border-radius: 9999px;
      outline: none;
      width: 100%;
    }
    input[type=range]::-webkit-slider-thumb {
      -webkit-appearance: none;
      width: 16px;
      height: 16px;
      border-radius: 50%;
      background: #D36B3F;
      cursor: pointer;
      box-shadow: 0 0 12px rgba(211, 107, 63, 0.95);
      border: 2px solid #ffffff;
      transition: transform 0.15s ease;
    }
    input[type=range]::-webkit-slider-thumb:hover {
      transform: scale(1.2);
    }

    /* Color Swatch Card */
    .color-slot {
      background: #0f1524;
      border: 1px solid #1c263c;
      border-radius: 10px;
      padding: 8px 10px;
      display: flex;
      align-items: center;
      gap: 10px;
      cursor: pointer;
      transition: border-color 0.2s ease;
    }
    .color-slot:hover {
      border-color: #D36B3F;
    }
  </style>
</head>
